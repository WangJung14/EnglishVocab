services:
  postgres:
    image: postgres:16
    container_name: englishvocab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: englishvocab
      POSTGRES_USER: englishvocab
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishvocab -d englishvocab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: