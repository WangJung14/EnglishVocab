
spring:
  application:
    name: englishvocab-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/englishvocab
    username: englishvocab
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
